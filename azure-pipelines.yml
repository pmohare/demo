
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: BuildJob
        displayName: Build Java 21 Application
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: Set up Java 21
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              java -version
              mvn -version
            displayName: Verify Java and Maven

          - script: |
              mvn --batch-mode --no-transfer-progress clean verify
            displayName: Build and Run Unit Tests

          - task: PublishTestResults@2
            displayName: Publish Unit Test Results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true
              testRunTitle: Java Unit Tests

          - script: |
              set -eu
              echo "Generated JAR files:"
              find target -maxdepth 1 -type f -name "*.jar" -print

              JAR_FILE=$(find target -maxdepth 1 -type f \
                -name "*.jar" ! -name "*-original.jar" \
                -print -quit)

              if [ -z "$JAR_FILE" ]; then
                echo "ERROR: No deployable JAR found in target."
                exit 1
              fi

              mkdir -p "$(Build.ArtifactStagingDirectory)/app"
              cp "$JAR_FILE" "$(Build.ArtifactStagingDirectory)/app/app.jar"

              echo "Selected executable JAR: $JAR_FILE"
              ls -lh "$(Build.ArtifactStagingDirectory)/app/app.jar"
            displayName: Select Executable JAR

          - publish: '$(Build.ArtifactStagingDirectory)/app'
            artifact: java-build
            displayName: Publish Executable JAR
            condition: succeeded()

  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployWebApp
        displayName: Deploy to pmohare-demo1
        steps:
          - download: current
            artifact: java-build

          - script: |
              echo "Deployment package:"
              ls -lh "$(Pipeline.Workspace)/java-build/app.jar"
            displayName: Verify Deployment Package

          - task: AzureWebApp@1
            displayName: Deploy Spring Boot JAR
            inputs:
              azureSubscription: 'Azure-CICD-Connection-Deployment'
              appType: webAppLinux
              appName: 'pmohare-demo1'
              package: '$(Pipeline.Workspace)/java-build/app.jar'
              runtimeStack: 'JAVA|21-java21'
