trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: Jira-Credentials

stages:
  # ==========================================
  # STAGE 1: BUILD, TEST AND SONARQUBE ANALYSIS
  # ==========================================
  - stage: Build
    displayName: Build, Test and Code Analysis
    jobs:
      - job: BuildJob
        displayName: Build Java 21 Application
        steps:
          - checkout: self
            fetchDepth: 0

          - task: SonarCloudPrepare@3
            displayName: Prepare SonarQube Cloud Analysis
            inputs:
              SonarCloud: 'Sonar'
              organization: 'pmohare'
              scannerMode: 'other'
              extraProperties: |
                sonar.projectKey=pmohare_demo

          - task: JavaToolInstaller@0
            displayName: Set up Java 21
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              java -version
              mvn -version
            displayName: Verify Java and Maven

          - task: Maven@4
            displayName: Build, Test and SonarQube Analysis
            inputs:
              mavenPOMFile: 'pom.xml'
              goals: 'clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar'
              options: '--batch-mode --no-transfer-progress'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              mavenVersionOption: 'Default'

          - task: SonarCloudPublish@3
            displayName: Publish SonarQube Quality Gate
            inputs:
              pollingTimeoutSec: '300'

          - script: |
              set -eu

              echo "Generated JAR files:"
              find target -maxdepth 1 -type f -name "*.jar" -print

              JAR_FILE=$(find target -maxdepth 1 -type f \
                -name "*.jar" ! -name "*-original.jar" \
                -print -quit)

              if [ -z "$JAR_FILE" ]; then
                echo "ERROR: No deployable JAR found in target."
                exit 1
              fi

              mkdir -p "$(Build.ArtifactStagingDirectory)/app"
              cp "$JAR_FILE" "$(Build.ArtifactStagingDirectory)/app/app.jar"

              echo "Selected executable JAR: $JAR_FILE"
              ls -lh "$(Build.ArtifactStagingDirectory)/app/app.jar"
            displayName: Select Executable JAR

          - publish: '$(Build.ArtifactStagingDirectory)/app'
            artifact: java-build
            displayName: Publish Executable JAR
            condition: succeeded()

  # ==========================================
  # STAGE 2: DEPLOY TO AZURE APP SERVICE
  # ==========================================
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: DeployWebApp
        displayName: Deploy to pmohare-demo1
        steps:
          - download: current
            artifact: java-build

          - script: |
              echo "Deployment package:"
              ls -lh "$(Pipeline.Workspace)/java-build/app.jar"
            displayName: Verify Deployment Package

          - task: AzureWebApp@1
            displayName: Deploy Spring Boot JAR
            inputs:
              azureSubscription: 'Azure-CICD-Connection-Deployment'
              appType: webAppLinux
              appName: 'pmohare-demo1'
              package: '$(Pipeline.Workspace)/java-build/app.jar'
              runtimeStack: 'JAVA|21-java21'

  # ==========================================
  # STAGE 3: REPORT RESULT TO JIRA
  # ==========================================
  - stage: NotifyJira
    displayName: Report Result and Update Jira
    dependsOn:
      - Build
      - Deploy
    condition: always()

    jobs:
      - job: JiraCallback
        displayName: Comment on Jira and Update Status
        condition: always()

        variables:
          BUILD_STAGE_RESULT: $[ stageDependencies.Build.BuildJob.result ]
          DEPLOY_STAGE_RESULT: $[ stageDependencies.Deploy.DeployWebApp.result ]

        steps:
          - checkout: none

          - script: |
              set -euo pipefail

              if [ -z "${JIRA_ISSUE_KEY:-}" ]; then
                echo "ERROR: JiraIssueKey was not passed by Jira automation."
                exit 1
              fi

              case "$JIRA_ISSUE_KEY" in
                *[!A-Z0-9-]*)
                  echo "ERROR: Jira issue key has an unexpected format."
                  exit 1
                  ;;
              esac

              echo "Build stage result: $BUILD_STAGE_RESULT"
              echo "Deploy stage result: $DEPLOY_STAGE_RESULT"

              if [ "$BUILD_STAGE_RESULT" = "Succeeded" ] && \
                 [ "$DEPLOY_STAGE_RESULT" = "Succeeded" ]; then
                PIPELINE_RESULT="SUCCESS"
                TARGET_STATUS="Done"
                DETAILS="Build, tests, SonarQube Quality Gate and deployment succeeded."
              else
                PIPELINE_RESULT="FAILURE"
                TARGET_STATUS="In Progress"
                DETAILS="Build or deployment failed, was skipped, or did not complete successfully."
              fi

              COMMENT_TEXT="Azure pipeline result: ${PIPELINE_RESULT}. Build stage: ${BUILD_STAGE_RESULT}. Deploy stage: ${DEPLOY_STAGE_RESULT}. Details: ${DETAILS} Pipeline run: ${BUILD_URL}"

              COMMENT_BODY=$(jq -n --arg text "$COMMENT_TEXT" '{
                body: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: $text
                        }
                      ]
                    }
                  ]
                }
              }')

              COMMENT_HTTP=$(curl -sS \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -X POST \
                -o /tmp/jira-comment-response.json \
                -w "%{http_code}" \
                --data "$COMMENT_BODY" \
                "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/comment")

              if [ "$COMMENT_HTTP" -lt 200 ] || [ "$COMMENT_HTTP" -ge 300 ]; then
                echo "ERROR: Jira comment failed (HTTP $COMMENT_HTTP)."
                cat /tmp/jira-comment-response.json
                exit 1
              fi

              echo "Jira result comment added."

              TRANSITION_HTTP=$(curl -sS \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Accept: application/json" \
                -o /tmp/jira-transitions.json \
                -w "%{http_code}" \
                "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/transitions")

              if [ "$TRANSITION_HTTP" -lt 200 ] || [ "$TRANSITION_HTTP" -ge 300 ]; then
                echo "ERROR: Could not retrieve Jira transitions (HTTP $TRANSITION_HTTP)."
                cat /tmp/jira-transitions.json
                exit 1
              fi

              TRANSITION_ID=$(jq -r --arg status "$TARGET_STATUS" '
                [.transitions[]
                 | select((.to.name | ascii_downcase) == ($status | ascii_downcase))
                 | .id][0] // empty
              ' /tmp/jira-transitions.json)

              if [ -z "$TRANSITION_ID" ]; then
                echo "ERROR: No available transition to '$TARGET_STATUS' from the current Jira status."
                jq -r '.transitions[] | "\(.name) -> \(.to.name)"' /tmp/jira-transitions.json
                exit 1
              fi

              TRANSITION_BODY=$(jq -n --arg id "$TRANSITION_ID" '{
                transition: { id: $id }
              }')

              TRANSITION_HTTP=$(curl -sS \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -o /tmp/jira-transition-response.json \
                -w "%{http_code}" \
                -X POST \
                --data "$TRANSITION_BODY" \
                "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/transitions")

              if [ "$TRANSITION_HTTP" -lt 200 ] || [ "$TRANSITION_HTTP" -ge 300 ]; then
                echo "ERROR: Jira status update failed (HTTP $TRANSITION_HTTP)."
                cat /tmp/jira-transition-response.json
                exit 1
              fi

              echo "Jira issue updated to '$TARGET_STATUS'."
            displayName: Post Result and Update Jira Status
            env:
              JIRA_BASE_URL: 'https://prashants-oes-b9363647.atlassian.net'
              JIRA_EMAIL: $(JIRA_EMAIL)
              JIRA_API_TOKEN: $(JIRA_API_TOKEN)
              JIRA_ISSUE_KEY: $(JiraIssueKey)
              BUILD_STAGE_RESULT: $(BUILD_STAGE_RESULT)
              DEPLOY_STAGE_RESULT: $(DEPLOY_STAGE_RESULT)
              BUILD_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
